server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.driver.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
app:
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:8081}
  jwt:
    secret: ${JWT_SECRET}
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:30}

logging:
  level:
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
  file:
    name: logs/pharma-backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
  pattern:
    console: "%d %-5level [%X{requestId}] %logger{36} - %msg%n"
    file: "%d %-5level [%X{requestId}] %logger{36} - %msg%n"
